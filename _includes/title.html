  shows the logo instead of the title. Here the logo is shown next to the title.
{%- endcomment -%}
{%- if site.logo -%}
  <img src="{{ site.logo | relative_url }}" alt="" class="site-logo">
{%- endif -%}
{{ site.title | default: site.github.repository_name }}
