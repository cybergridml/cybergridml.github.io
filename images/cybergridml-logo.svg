  <path d="M30 91 L96 127 L162 91" stroke="#10B8B4" stroke-width="10"/>
  <path d="M30 128 L96 164 L162 128" stroke="#172848" stroke-width="10"/>
  <!-- Simplified interconnected cyber-physical assets on the upper plane -->
  <path d="M63 55 L96 37 L129 55" stroke="#10B8B4" stroke-width="7"/>
</g>
